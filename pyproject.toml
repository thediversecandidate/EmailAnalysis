[project]
name = "emailanalysis"
version = "0.1.0"
description = "Email intake/triage thin client for GenesisAI -- classifies commissioning correspondence and drafts cited replies"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
